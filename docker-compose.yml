services:
  app:
    image: happyclo/tts-node:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - USER_STORAGE_MODE=mongo
      - MONGO_URI=${MONGO_URI}
      - MONGODB_URI=${MONGODB_URI}
      - MONGO_DB=${MONGO_DB:-tts}
      - MONGO_PROXY_URL=${MONGO_PROXY_URL}
    volumes:
      # 容器内以 uid/gid 100(nodejs) 运行。bind mount 会用宿主机目录的属主覆盖镜像里的
      # chown；若 ./data 不存在而由 docker 自动创建，属主是 root，媒体工具的工作根
      # (/app/data/media-tool) 与其他落盘目录就会不可写。首次部署先执行：
      #   mkdir -p ./data && chown -R 100:100 ./data
      # 或改用命名卷（`- media-data:/app/data`），首次挂载会继承镜像中的属主。
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.PORT||3000;fetch('http://127.0.0.1:'+p+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  default:
    enable_ipv6: true
